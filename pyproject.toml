[project]
name = "maiweave"
version = "0.10.2"
description = "让麦麦有自己的生活，也让你参与其中：聊天改变日程，阅读与见闻延续到对话，日记化作 QQ 空间随笔"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["maibot-plugin-sdk==2.21.0", "tzdata>=2026.1", "lunar_python==1.4.8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
