[project]
name = "maiweave"
version = "0.9.2"
description = "为 MaiBot 添加自主日程、睡眠作息、阅读日记与主动交流，让聊天改变生活，让经历延续到下一次对话"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["maibot-plugin-sdk==2.21.0", "tzdata>=2026.1", "lunar_python==1.4.8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
