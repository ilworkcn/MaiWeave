let data,day=0,chartKey='energy',busy=false,received=0;
const time=value=>value?.slice(11,16)||'—';
const clockNow=()=>new Date(new Date(data.now).getTime()+Date.now()-received);
async function detail(plan){const id=plan.id;$('detailContent').dataset.plan=id;$('detailContent').innerHTML=`<small>${esc(plan.kind_label)} · ${esc(plan.status_label)} · ${esc(plan.source_label)}</small><h2>${esc(plan.title)}</h2><p>${esc(time(plan.start))}–${esc(time(plan.end))} · ${esc(plan.location||'未指定地点')}</p><div id="explanation">正在读取活动经过…</div>`;$('detail').showModal();try{const r=await maibot.query('timeline',{plan_id:id});if($('detailContent').dataset.plan!==id)return;$('explanation').innerHTML=r.events.map(e=>`<article class="moment"><small>${esc(e.at.replace('T',' ').slice(5,16))} · ${esc(e.title)}</small><p>${esc(e.text)}</p></article>`).join('')+(r.balance?`<p class="muted">安排时的今日节奏：${esc(r.balance.totals.map(x=>x.activity+' '+x.minutes+'分钟').join('、')||'刚开始今天的生活')} · 最近连续 ${r.balance.consecutive} 次${esc(r.balance.last_activity)}</p>`:'')}catch(e){if($('detailContent').dataset.plan===id)$('explanation').textContent='读取失败：'+e.message}}

function paintProgress(){if(!data)return;const p=data.current,now=clockNow();const offset=data.now.slice(-6),minutes=(offset[0]==='-'?-1:1)*(Number(offset.slice(1,3))*60+Number(offset.slice(4,6))),local=new Date(now.getTime()+minutes*60000);$('clock').textContent=local.toISOString().slice(11,16);$('date').textContent=data.now.slice(5,10).replace('-','月')+'日';$('activityProgress').hidden=!p;if(p){const total=new Date(p.end)-new Date(p.start),elapsed=now-new Date(p.start),pct=Math.max(0,Math.min(100,elapsed/total*100));$('progressFill').style.width=pct+'%';$('progressText').textContent=`已进行 ${Math.max(0,Math.floor(elapsed/60000))} 分钟 · ${Math.round(pct)}%`;$('endTime').textContent='预计 '+time(p.end)+' 结束'}}
function paintChart(){const rows=data.energy_trend,min=chartKey==='mood'?-100:0,max=100,y=v=>145-(v-min)/(max-min)*125,x=i=>40+i*510/Math.max(1,rows.length-1);document.querySelectorAll('[data-chart]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.chart===chartKey));if(!rows.length){$('chart').innerHTML='<p class="empty">生活推进后，这里会留下状态轨迹。</p>';return}const ticks=chartKey==='mood'?[-100,0,100]:[0,50,100];$('chart').innerHTML=`<svg viewBox="0 0 580 180" role="img" aria-label="近24小时${chartKey==='mood'?'心情':'精力'}变化">${ticks.map(v=>`<line class="guide" x1="40" x2="550" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v)+4}">${v}</text>`).join('')}<polyline class="trace" points="${rows.map((r,i)=>x(i)+','+y(r[chartKey])).join(' ')}"/>${rows.map((r,i)=>`<circle tabindex="0" data-point="${i}" aria-label="${esc(r.time)}：${r[chartKey]}" cx="${x(i)}" cy="${y(r[chartKey])}" r="3"><title>${esc(r.time)} · ${r[chartKey]}</title></circle>`).join('')}${[...new Set([0,Math.floor((rows.length-1)/2),rows.length-1])].map(i=>`<text text-anchor="middle" x="${x(i)}" y="174">${esc(rows[i].time)}</text>`).join('')}</svg>`;for(const point of $('chart').querySelectorAll('[data-point]')){const show=()=>{$('chartHint').textContent=rows[point.dataset.point].time+' · '+(chartKey==='mood'?'心情':'精力')+' '+Math.round(rows[point.dataset.point][chartKey])};point.onfocus=show;point.onmouseenter=show}}
function render(){const d=data;$('content').hidden=false;$('diagnostics').hidden=false;$('loading').hidden=true;$('refreshTime').textContent='更新于 '+time(d.now);$('activity').textContent=d.activity;$('tags').innerHTML=`<span class="pill"><span class="dot"></span>${esc(d.sleep)}</span><span class="pill">${esc(d.enabled)}</span><span class="pill">${esc(d.current?.kind_label||'自在时刻')}</span>`;$('where').textContent=d.location+(d.weather?' · '+d.weather.city+' '+d.weather.label+' '+d.weather.temperature+'℃'+(d.weather.stale?'（上次观测）':''):' · 天气尚未更新');$('reason').textContent=d.current?.motivation||d.planning_status;$('next').innerHTML=`<span class="next-label">接下来</span><div><b>${esc(d.upcoming?.title||'留一点空白，下一步再安排')}</b><div class="muted">${esc(d.upcoming?time(d.upcoming.start)+' · '+(d.upcoming.location||'当前地点'):d.planning_status)}</div></div>`;paintProgress();$('sleepMode').textContent=d.schedule_mode;
$('vitals').innerHTML=[['精力',d.state.energy,'--accent',d.state.energy<30?'想歇一会儿':'还有余力'],['饥饿',d.state.hunger,'--warm',d.state.hunger>70?'该吃点东西了':'肚子还舒服'],['压力',d.state.stress,'--violet',d.state.stress>70?'需要放松':'节奏平稳']].map(([label,value,color,hint])=>`<div class="vital"><div class="vital-head"><span>${label} <small>· ${hint}</small></span><b>${Math.round(value)}<small> /100</small></b></div><div class="progress"><span style="width:${value}%;background:var(${color})"></span></div></div>`).join('');$('moodLabel').textContent=d.mood_label;$('moodValue').textContent=(d.state.mood>0?'+':'')+Math.round(d.state.mood)+' / 100';$('sleepDebt').textContent='睡眠债 '+d.state.sleep_debt.toFixed(1)+' 小时';
$('timelineTitle').textContent=d.day+' · '+['昨天留下的轨迹','今天正在发生','明天已有的安排'][day+1];document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.day)===day));$('timeline').innerHTML=d.timeline.map((p,i)=>`<button class="segment" style="left:${p.start_minute/14.4}%;width:${(p.end_minute-p.start_minute)/14.4}%;--segment:${colors[p.kind]}" data-plan="${i}" aria-label="${esc(p.time_label+' '+p.title)}" title="${esc(p.time_label+' '+p.title)}"></button>`).join('')+(day===0?`<span class="now-line" style="left:${(Number(d.now.slice(11,13))*60+Number(d.now.slice(14,16)))/14.4}%"></span>`:'');$('legend').innerHTML=[...new Map(d.timeline.map(p=>[p.kind,p.kind_label]))].map(([kind,label])=>`<span><i style="--segment:${colors[kind]}"></i>${esc(label)}</span>`).join('');$('agenda').innerHTML=d.timeline.length?d.timeline.map((p,i)=>`<button class="agenda-item ${p.status==='active'?'active':''}" style="--segment:${colors[p.kind]}" data-plan="${i}"><small>${esc(p.time_label)} · ${esc(p.status_label)}</small><b>${esc(p.title)}</b><small>${esc(p.location||'当前地点')} · ${esc(p.kind_label)}</small></button>`).join(''):'<p class="empty">这一天还没有安排。</p>';$('timelineNote').textContent=d.timeline_total>200?'展示前200项，完整记录可到日程页翻阅。':'点击时间条或活动，查看安排详情。';document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>detail(d.timeline[Number(b.dataset.plan)]));paintChart();
$('moments').innerHTML=d.moments.length?d.moments.map(m=>`<article class="moment"><small>${esc(m.time.slice(5,16))} · ${esc(m.source)} · ${m.importance}分</small><p>${esc(m.summary)}</p></article>`).join(''):'<p class="empty">今天的小事，会慢慢留在这里。</p>';
$('book').innerHTML=d.book?`<small>${esc(d.book.status)} · 已读 ${d.book.progress}%</small><h3 class="shelf-title">${esc(d.book.title)}</h3><div class="progress"><span style="width:${d.book.progress}%"></span></div><p class="excerpt">${esc(d.book.thoughts||'下一次阅读后，这里会留下新的感想。')}</p>${d.book.question?`<p class="question">还在想：${esc(d.book.question)}</p>`:''}`:'<p class="empty">书架还没有选定读物。放一本喜欢的书，让下一段闲暇有个去处。</p>';$('diary').innerHTML=d.diary?`<small>${esc(d.diary.day)}</small><p class="excerpt" style="margin-top:10px">${esc(d.diary.content)}</p>`:'<p class="empty">日记会随写作日程慢慢积累，记录一天去了哪里、做了什么。</p>';
$('summary').innerHTML=`<div><b>${d.experience_count}</b><small>段生活经历</small></div><div><b>${d.habit_count}</b><small>个近期习惯 · ${d.dream_count}场梦</small></div><div><b>${d.usage.known_calls?d.usage.total.toLocaleString():'—'}</b><small>今日已知 Token · ${d.usage.calls}次调用${d.usage.missing_calls?' · '+d.usage.missing_calls+'次未返回用量':''}</small></div>`;
$('diagnosticTitle').textContent='交流与运行详情 · '+(d.errors==='无运行错误'?'运行正常':'有运行错误');$('shareStatus').textContent=d.share_status;$('shareSummary').innerHTML=(d.share_summary||[]).map(r=>`<div class="log"><b>${esc(r.session)} · 今天已发送 ${esc(r.sent)} / ${esc(r.limit)} 次</b><p>${esc(r.last)}</p>${r.pending.map(t=>`<p>${esc(t.title)} · ${t.status==='等待发送回执'?'等待发送回执':'最早判断：'+esc(t.next_at)} · 截止：${esc(t.expires_at)}</p>`).join('')}</div>`).join('')||'<p class="muted">在个人资料中选择交流聊天流，开启主动交流。</p>';$('shares').innerHTML=d.share_decisions.length?d.share_decisions.map(r=>`<details class="log"><summary>${esc(r.at)} · ${esc(r.mode)} · ${esc(r.outcome)} · ${esc(r.delivery)}</summary><p>聊天流：${esc(r.session)}\n${esc(r.score)}\n${esc(r.reason)}\n${esc(r.followup==='answered'?'已接话：'+r.response:r.followup==='closed'?'已聊完：'+r.response:r.sent_at?'等待接话':'')}\n${esc(r.observation||'')}</p></details>`).join(''):'<p class="empty">还没有主动交流判定。</p>';$('planningStatus').textContent=d.planning_status;$('planning').innerHTML=d.planning_history.map(r=>`<details class="log"><summary>${esc(r.at)} · ${esc(r.title)} · ${r.minutes}分钟</summary><p>${esc(r.source)} · ${esc(r.place)}\n${esc(r.reason)}\n${esc(r.followup==='answered'?'已接话：'+r.response:r.followup==='closed'?'已聊完：'+r.response:r.sent_at?'等待接话':'')}\n${esc(r.observation||'')}</p></details>`).join('');$('runtime').textContent=d.errors+' · 最后推进 '+d.updated_at+'\n'+d.travel+' · '+d.awake_until+'\n最近规划错误：'+d.planning_failure;$('jobs').innerHTML=d.jobs.map(j=>`<div class="log">${esc(j.label)} · ${esc(j.status)}${j.error?' · '+esc(j.error):''}</div>`).join('');}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;document.querySelectorAll('[data-day]').forEach(b=>b.disabled=true);try{data=await maibot.query('data',{day_offset:day});received=Date.now();render();$('error').hidden=true}catch(e){$('error').textContent='刷新失败：'+e.message;$('error').hidden=false;$('loading').hidden=true}finally{busy=false;$('refresh').disabled=false;document.querySelectorAll('[data-day]').forEach(b=>b.disabled=false)}}
$('refresh').onclick=refresh;$('close').onclick=()=>$('detail').close();document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=Number(b.dataset.day);refresh()});document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{chartKey=b.dataset.chart;paintChart()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>maibot.navigate(b.dataset.page));await maibot.ready;await refresh();setInterval(()=>{if(!document.hidden)refresh()},30000);setInterval(paintProgress,1000);
</script></body></html>
