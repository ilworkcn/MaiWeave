<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaiWeave 编辑工作台</title>
<style>
body{margin:0;padding:20px;font-family:var(--maibot-font-body,system-ui);color:var(--maibot-foreground);background:var(--maibot-background)}
header{margin-bottom:20px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:160px}.workspace{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr);gap:20px}.panel{padding:18px;border:1px solid var(--maibot-border,#ccc);border-radius:var(--maibot-radius,8px)}#records{display:grid;gap:8px;max-height:620px;overflow:auto}.record{text-align:left;padding:12px}.record small{display:block;margin-top:6px;color:var(--maibot-muted,#777)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;font-size:14px}label.wide{grid-column:1/-1}input,select,textarea{box-sizing:border-box;width:100%}input[type=checkbox]{width:auto;justify-self:start}textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}#status{min-height:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.empty{padding:20px;color:var(--maibot-muted,#777)}@media(max-width:720px){.workspace,.fields{grid-template-columns:1fr}label.wide{grid-column:auto}}
</style></head>
<body class="maibot-page">
<header><h1 id="heading">编辑工作台</h1><p class="maibot-muted" id="intro">选中记录，修改表单，再保存。已有内容会自动填入。</p></header>
<div class="toolbar"><select id="category" class="maibot-select" style="width:auto"></select><input id="query" class="maibot-input" placeholder="搜索标题、姓名或记录内容"><button id="search" class="maibot-button">查找</button><button id="new" class="maibot-button">新建</button></div>
<p id="status" role="status" aria-live="polite"></p>
<main class="workspace"><section class="panel"><h2 id="count">记录</h2><div id="records"></div></section><section class="panel"><h2 id="formTitle">编辑内容</h2><form id="form"><div id="fields" class="fields"></div><div class="actions"><button id="save" class="maibot-button maibot-button-primary" type="submit">保存</button><button id="remove" class="maibot-button" type="button">删除</button></div></form><pre id="details" class="maibot-muted"></pre></section></main>
<script type="module">
const $=id=>document.getElementById(id);
const kinds={leisure:'休闲',study:'学习',work:'工作',sleep:'睡眠',meal:'用餐',travel:'出行',rest:'休息',social:'社交'};
// 字段依次声明参数名、标签、控件、初始值和原记录字段。
const schemas={
 profile:{label:'个人资料',save:'profile',id:'profile_id',remove:'delete_profile',fields:[['name','姓名或称呼','text',''],['session_id','所属聊天流 ID','text',''],['user_id','用户 ID（选填）','text',''],['notes','备注（选填）','textarea','']]},
 anniversary:{label:'生日与纪念日',save:'anniversary',id:'anniversary_id',remove:'delete_anniversary',fields:[['profile_id','所属人物','profiles',''],['title','名称','text','生日'],['calendar','历法',{solar:'公历',lunar:'农历'},'solar'],['month','月份','number',1],['day','日期','number',1],['year','出生或起始年份（未知填0）','number',0],['leap_month','农历闰月','checkbox',false],['enabled','开启当日提醒','checkbox',true]]},
 plan:{label:'生活日程',save:'plan',id:'plan_id',editOnly:true,fields:[['new_title','标题','text','','title'],['new_start','开始时间（ISO格式）','text','','start'],['new_end','结束时间（ISO格式）','text','','end'],['new_location','地点','text','','location']]},
 routine:{label:'重复日程',save:'routine',id:'rule_id',fields:[['title','标题','text',''],['anchor_date','起始日期','date',''],['start_time','开始时间','time','20:00'],['duration_minutes','时长（分钟）','number',30],['frequency','频率',{daily:'每天',weekly:'每周',monthly:'每月'},'weekly'],['interval','间隔','number',1],['weekdays','星期（逗号分隔）','text','周一,周三,周五'],['month_day','每月日期','number',1],['until','截止日期（选填）','text',''],['kind','活动类型',kinds,'leisure'],['location','地点','text',''],['session_id','聊天流（公共活动可留空）','text',''],['participants','参与者（逗号分隔）','text',''],['simulation','角色模拟活动','checkbox',true]]},
 place:{label:'生活地点',save:'place',id:'place_id',fields:[['name','地点名称','text',''],['outdoor','室外地点','checkbox',false],['description','地点描述','textarea','']]},
 route:{label:'地点路线',save:'route',fields:[['origin','起点','places',''],['destination','终点','places',''],['minutes','耗时（分钟）','number',15],['mode','出行方式','text','步行']]},
 experience:{label:'生活经历',save:'experience',id:'experience_id',editOnly:true,fields:[['summary','经历摘要','textarea',''],['evidence','本次补充或更正的依据','textarea',''],['detail_key','细节项目（选填）','text',''],['detail_value','细节内容','textarea','']]},
 thread:{label:'跟进话题',save:'thread',id:'thread_id',fields:[['title','话题','text',''],['context','具体内容','textarea',''],['due_at','跟进时间（ISO格式）','text',''],['session_id','所属聊天流','text','']]}
};
let data={records:[],profiles:[],places:[]},selected=null,category='profile';
function message(text){$('status').textContent=text}
function labelFor(row){return row.person ? `${row.person} · ${row.title}` : row.name||row.title||row.summary||`${row.origin} → ${row.destination}`}
function edit(row){
 selected=row;const schema=schemas[category];$('fields').replaceChildren();$('formTitle').textContent=row?`编辑${schema.label}`:`新建${schema.label}`;
 for(const [name,label,type,initial,source] of schema.fields){
  const wrapper=document.createElement('label');wrapper.textContent=label;if(type==='textarea')wrapper.className='wide';
  let value=row?.[source||name]??initial;
  if(Array.isArray(value))value=name==='weekdays'?value.map(i=>['周一','周二','周三','周四','周五','周六','周日'][i]).join(','):value.join(',');
  let input;
  if(typeof type==='object'||type==='profiles'||type==='places'){
   input=document.createElement('select');input.className='maibot-select';
   const choices=typeof type==='object'?Object.entries(type):data[type].map(item=>[item.id,item.name]);
   for(const [key,title] of choices)input.add(new Option(title,key));
   if(!choices.length)input.add(new Option(type==='profiles'?'请先添加个人资料':'请先添加地点',''));
  }else{input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.className='maibot-input'}
  input.name=name;input.id='field_'+name;
  if(type==='checkbox')input.checked=Boolean(value);else if(value!==''||input.tagName!=='SELECT')input.value=String(value);
  wrapper.append(input);$('fields').append(wrapper);
 }
 $('remove').hidden=!row||!schema.remove;$('save').disabled=Boolean(schema.editOnly&&!row);$('new').disabled=Boolean(schema.editOnly);
 $('details').textContent=row?.next_date?`下一次：${row.next_date} · 还有 ${row.days_left} 天`:row?.details?JSON.stringify(row.details,null,2):'';
 for(const button of $('records').children)button.setAttribute('aria-pressed',String(button.dataset.id===row?.id));
}
async function refresh(keepId=''){
 data=await maibot.query('records',{category,query:$('query').value});$('records').replaceChildren();$('count').textContent=`${schemas[category].label} · ${data.total} 条`;
 for(const row of data.records){const button=document.createElement('button');button.type='button';button.className='maibot-button record';button.dataset.id=row.id;button.textContent=labelFor(row);
 const hint=document.createElement('small');hint.textContent=row.next_date?`${row.calendar_label} ${row.date_label} · ${row.next_date}`:row.session_id||row.description||row.id;button.append(hint);button.onclick=()=>edit(row);$('records').append(button)}
 if(!data.records.length){const p=document.createElement('p');p.className='empty';p.textContent='这里还没有记录，可以先新建一条。';$('records').append(p)}
 edit(data.records.find(row=>row.id===keepId)||null);
}
async function run(work){message('处理中…');try{await work()}catch(error){message(error.message)}}
$('form').onsubmit=event=>{event.preventDefault();run(async()=>{
 const schema=schemas[category],args={};
 for(const [name,,type,,source] of schema.fields){const input=$('field_'+name);const value=type==='checkbox'?input.checked:type==='number'?Number(input.value):input.value;
  if(category==='plan'&&value===(selected?.[source]??''))continue;args[name]=value;}
 if(schema.id&&selected)args[schema.id]=selected.id;
 if(category==='plan'&&Object.keys(args).length===1){message('内容与当前记录一致');return}
 $('save').disabled=true;try{const saved=await maibot.action(schema.save,args);await refresh(saved.id||selected?.id||'');message('已保存')}finally{$('save').disabled=false}
 })};
$('remove').onclick=()=>run(async()=>{const schema=schemas[category];await maibot.action(schema.remove,{[schema.id]:selected.id});await refresh();message('已删除')});
$('new').onclick=()=>{edit(null);message('填写后点击保存')};$('search').onclick=()=>run(async()=>{await refresh();message('已更新')});
$('category').onchange=()=>run(async()=>{category=$('category').value;selected=null;$('query').value='';await refresh();message('')});
await maibot.ready;
const personalPage=maibot.page.id==='anniversaries';
if(personalPage){$('heading').textContent='个人资料与纪念日';$('intro').textContent='添加人物资料，再记录生日与纪念日。选中记录即可修改。提醒沿用主动交流设置；农历小月按月底，普通年份的闰月纪念日按同月计算。'}
for(const [key,schema] of Object.entries(schemas))if(!personalPage||['profile','anniversary'].includes(key))$('category').add(new Option(schema.label,key));
await run(async()=>{await refresh();message('')});
</script></body></html>
